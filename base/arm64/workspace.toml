[workspace]
root_dir = "."
build_dir = "build/gaia/${build.name}"
out_dir = "output/gaia/${build.name}"

[[workspace.named_paths]]
alias = "shared_assets"
path = "base/arm64/assets"
kind = "host"

[[workspace.named_paths]]
alias = "artifacts"
path = "artifacts"
kind = "host"

[reporting]
summary = true
provenance = true
manifest = true

[providers.git]
allow_remote_resolution = true
retry_attempts = 1
retry_backoff_ms = 0
retry_backoff_strategy = "fixed"
timeout_seconds = 1800

# orion-node is a cargo build inside Docker (toolchain download on first use);
# on a busy disk the default 300 s is not enough.
[providers.rust]
retry_attempts = 1
retry_backoff_ms = 0
retry_backoff_strategy = "fixed"
timeout_seconds = 3600

[providers.java]
retry_attempts = 1
retry_backoff_ms = 0
retry_backoff_strategy = "fixed"
timeout_seconds = 1800

[providers.buildroot]
retry_attempts = 1
retry_backoff_ms = 0
retry_backoff_strategy = "fixed"
# A from-scratch build compiles OpenJDK on targets that use Buildroot's
# OpenJDK (Raze links a prebuilt runtime instead); on a busy disk that alone
# can take hours.
timeout_seconds = 28800
# make -j sized by Gaia's core split, independent packages built in parallel
# (BR2_PER_PACKAGE_DIRECTORIES), and a compiler cache shared by every build.
local_jobs = 0
parallel_packages = true

[providers.buildroot.package_cache]
enabled = true

[providers.buildroot.ccache]
enabled = true
max_size = "50G"

[execution]
jobs = 0

# Every source, Buildroot and artifact command runs in this image; build it
# from docker/build (see GAIA.md).
[execution.docker]
enabled = true
image = "photonvision-gaia-build:trixie"

[failure]
rollback_on_error = true
preserve_failed_outputs = true
rollback_domains = ["artifacts", "installs", "stage", "checkpoints"]
