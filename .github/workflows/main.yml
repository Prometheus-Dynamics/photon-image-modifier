name: Build images
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target:
          - generic-arm64
          - raspi
          - raspi_dev
          - dev-pi
          - limelight
          - limelight3
          - limelight3g
          - limelight4
          - luma_p1
          - snakeyes
          - raze
          - opi
          - rubikpi3

    name: "Gaia build for ${{ matrix.target }}"

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fetch tags
      run: git fetch --tags --force

    - name: Build Gaia
      run: |
        git clone --depth=1 https://github.com/PhotonVision/Gaia-Image-Builder ../Gaia-Image-Builder
        cargo build --manifest-path ../Gaia-Image-Builder/Cargo.toml --bin gaia

    - name: Prepare PhotonVision artifact
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p artifacts
        release_url="https://api.github.com/repos/photonvision/photonvision/releases/latest"
        if [[ -n "${GH_TOKEN:-}" ]]; then
          release_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$release_url")"
        else
          release_json="$(curl -fsSL "$release_url")"
        fi
        download_url="$(jq -r '.assets[] | select(.name | test("linuxarm64\\.jar$")) | .browser_download_url' <<<"$release_json" | head -n1)"
        test -n "$download_url"
        curl -fL "$download_url" -o artifacts/photonvision-linuxarm64.jar

    - name: Run Gaia
      run: |
        ../Gaia-Image-Builder/target/debug/gaia run build.toml \
          --set input.target="${{ matrix.target }}" \
          --set input.profile=full \
          --set input.version="$(git describe --tags --abbrev=0 2>/dev/null || echo latest)"

    - name: Upload image artifacts
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: |
          output/gaia/**/*.xz
          output/gaia/**/*.img
          output/gaia/**/*.tar
        if-no-files-found: error
        retention-days: 1

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
      - run: find
      - uses: pyTooling/Actions/releaser@v1.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: 'Dev'
          rm: true
          files: |
            **/*.xz
            **/*.img
            **/*.tar
        if: github.event_name == 'push'
