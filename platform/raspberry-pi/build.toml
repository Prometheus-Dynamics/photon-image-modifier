description = "Shared Raspberry Pi platform layer: Pi firmware, boot conventions, network defaults, and camera/display runtime dependencies."
target = "raspberry-pi"

[image]
kind = "buildroot"
config_overrides = [
  ["BR2_LINUX_KERNEL", "y"],
  ["BR2_LINUX_KERNEL_DEFCONFIG", "\"bcm2712\""],
  ["BR2_PACKAGE_RPI_FIRMWARE", "y"],
  ["BR2_PACKAGE_RPI_FIRMWARE_INSTALL_DTB_OVERLAYS", "y"],
  # Buildroot 2026.08 removed rpi-userland (setting it now selects
  # BR2_LEGACY). Raze gets vcgencmd from the device package's rpi-utils; the
  # other Pi targets have no vcgencmd, so PhotonVision's Pi metrics (throttle,
  # GPU memory) report errors there.
  ["BR2_PACKAGE_NETWORK_MANAGER", "y"],
  ["BR2_PACKAGE_NET_TOOLS", "y"],
  ["BR2_PACKAGE_DTC", "y"],
  ["BR2_PACKAGE_LIBCAMERA", "y"],
  # GPU stack for the libcamera GL driver: Mesa v3d (Pi 4/5, needs vc4 for KMS)
  # with EGL, GLES and gbm. Without a Gallium driver Mesa installs no
  # libEGL/libGLESv2/libgbm at all.
  ["BR2_PACKAGE_MESA3D", "y"],
  ["BR2_PACKAGE_MESA3D_GALLIUM_DRIVER_V3D", "y"],
  ["BR2_PACKAGE_MESA3D_GALLIUM_DRIVER_VC4", "y"],
  ["BR2_PACKAGE_MESA3D_OPENGL_EGL", "y"],
  ["BR2_PACKAGE_MESA3D_OPENGL_ES", "y"],
  ["BR2_PACKAGE_MESA3D_GBM", "y"],
  ["BR2_PACKAGE_LIBDRM", "y"],
]

[[stage.files]]
id = "rpi-network-blacklist"
src = "platform/raspberry-pi/assets/rpi-blacklist.conf"
dest = "/etc/modprobe.d/blacklist.conf"
origin = "static-asset"

[image.feed]
stage_files = ["rpi-network-blacklist"]
