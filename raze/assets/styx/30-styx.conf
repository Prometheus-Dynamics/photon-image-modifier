# Styx vision backend (experimental): PhotonVision runs with Styx capture and Eidos AprilTags,
# not libcamera. The unit's ExecStart is replaced; the rest of photonvision.service is kept.
[Service]
ExecStart=
ExecStart=/usr/bin/java -Xmx512m -Dphotonvision.backend=styx -jar /opt/photonvision/photonvision.jar
