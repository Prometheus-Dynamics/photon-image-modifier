# Styx vision backend (experimental): PhotonVision runs with Styx capture and Eidos AprilTags,
# not libcamera. Selected through the environment (StyxBackend reads PHOTONVISION_BACKEND), so
# the ExecStart that raze/build.toml's 20-read-only-root.conf sets is kept as it is.
[Service]
Environment=PHOTONVISION_BACKEND=styx
