# board-data-owners (device package): service state this image keeps on /data
# (/var is bound from /data/var), by the user that must own it here. Another
# OS image on the same board may have given that user a different id; the
# repair re-owns the path at boot when it does not match.
orion /data/var/lib/orion
lemnos /data/var/lib/lemnos
