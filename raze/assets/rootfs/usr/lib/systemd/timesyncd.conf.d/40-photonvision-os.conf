# No RTC battery: save the time every 30 s even without NTP (the clock file
# is on /data), and retry NTP every 30 s, so the clock is set as soon as any
# link reaches the internet. NetworkManager's dispatcher adds DHCP-provided
# NTP servers and restarts timesyncd when connectivity appears
# (/usr/lib/NetworkManager/dispatcher.d/40-photonvision-timesync). The
# fallback servers are timesyncd's built-in defaults.
[Time]
SaveIntervalSec=30
ConnectionRetrySec=30
