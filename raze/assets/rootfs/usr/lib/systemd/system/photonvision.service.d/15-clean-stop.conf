# The stock unit stops PhotonVision with `ExecStop=systemctl kill photonvision`,
# which signals the stop command itself too, and the JVM exits 143 on SIGTERM:
# every plain stop or restart was recorded as a failure. systemd sends SIGTERM
# on its own; 143 is the JVM's normal answer to it.
[Service]
ExecStop=
SuccessExitStatus=143
