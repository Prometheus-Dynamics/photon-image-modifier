# PhotonVision on the read-only root:
#  - its WPILib/OpenCV natives are unpacked into the image at build time
#    (/usr/lib/photonvision/wpilib, linked from /root/.wpilib), so the native
#    loader finds them and writes nothing;
#  - libraries that unpack their own natives (sqlite-jdbc, diozero, JNA) use
#    /tmp, a tmpfs;
#  - its settings and logs are on /data (photonvision-data-setup.service).
[Unit]
Requires=photonvision-data-setup.service
After=photonvision-data-setup.service

[Service]
ExecStart=
ExecStart=/usr/bin/java -Xmx512m -Djava.io.tmpdir=/tmp -Djna.tmpdir=/tmp/jna --enable-native-access=ALL-UNNAMED -jar /opt/photonvision/photonvision.jar
