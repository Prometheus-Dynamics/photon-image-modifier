# The board has no RTC battery. timesyncd keeps the last known time in
# /var/lib/systemd/timesync/clock and moves the clock forward to it at boot,
# so time never goes backwards across reboots; /var is /data/var, mounted by
# photonvision-data-early.service, which must come first (timesyncd starts
# before local-fs.target).
[Unit]
Wants=photonvision-data-early.service
After=photonvision-data-early.service
