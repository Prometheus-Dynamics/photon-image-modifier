# Host keys are on /data (sshd_config.d/40-photonvision-os.conf), made by
# photonvision-data-setup.service; `ssh-keygen -A` would try to write them to
# the read-only /etc/ssh and fail the unit.
[Unit]
Wants=photonvision-data-setup.service
After=photonvision-data-setup.service

[Service]
ExecStartPre=
