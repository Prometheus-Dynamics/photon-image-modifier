# The static hostname lives on /data (/etc/hostname is a link to it on the
# read-only root): hostnamectl set-hostname, which PhotonVision runs when its
# hostname setting changes, writes it there.
[Unit]
After=photonvision-data-early.service

[Service]
Environment=SYSTEMD_ETC_HOSTNAME=/data/etc/hostname
ReadWritePaths=/data/etc
