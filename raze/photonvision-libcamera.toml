description = "Raze target, PhotonVision on the libcamera backend: the libcamera GL driver and the PhotonVision jar built against it (input.backend = libcamera)."
target = "raze"

[[sources]]
id = "photon-libcamera-gl-driver"
kind = "git"
repo = "${input.raze_libcamera_driver_repo}"
rev = "${input.raze_libcamera_driver_rev}"
refresh = "auto"

# The GPU camera driver JNI is cross-compiled with the Buildroot toolchain
# against the image's own sysroot (libcamera, Mesa EGL/GLESv2, gbm), so it
# links exactly the libraries that ship in the image. It runs after Buildroot
# prepare, when that toolchain and sysroot exist, and publishes its jars to
# the workspace maven repo that the PhotonVision build reads.
[[artifacts]]
id = "photon-libcamera-gl-driver"
kind = "java"
build_target = "build/libs/photon-libcamera-gl-driver-linuxarm64.jar"
build_command = ["./tools/build_arm64_jni.sh"]
build_env = [
  ["BUILDROOT_HOST_DIR", "${project.root_dir}/${workspace.build_dir}/image/buildroot-output/host"],
  ["MAVEN_LOCAL_REPO", "${project.root_dir}/${workspace.build_dir}/m2"],
  ["CMAKE_EXTRA_ARGS", "-DPHOTON_LIBCAMERA_LINK_GLES=ON -DPHOTON_LIBCAMERA_WERROR=OFF"],
  ["GRADLE_EXTRA_ARGS", "-PversionString=${input.raze_libcamera_driver_version}"],
  ["CLEAN_BUILD", "1"],
]
after_image_prepare = true
source = "photon-libcamera-gl-driver"
install_name = "photon-libcamera-gl-driver.jar"
install_class = "archive"
output_path = "${workspace.out_dir}/artifacts/photon-libcamera-gl-driver.jar"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "${input.raze_jar_build_image}"
dockerfile = "${input.raze_jar_build_dockerfile}"

[[artifacts]]
id = "photonvision-jar"
kind = "java"
build_target = "photon-server/build/libs/photonvision-${input.raze_photonvision_version}-linuxarm64.jar"
build_command = ["${project.root_dir}/raze/scripts/build-photonvision-jar.sh"]
build_env = [
  ["PHOTONVISION_VERSION", "${input.raze_photonvision_version}"],
  ["LIBCAMERA_DRIVER_VERSION", "${input.raze_libcamera_driver_version}"],
  ["MAVEN_LOCAL_REPO", "${project.root_dir}/${workspace.build_dir}/m2"],
]
source = "photonvision-source"
dependencies = ["photon-libcamera-gl-driver"]
install_name = "photonvision.jar"
install_class = "archive"
install_dest_hint = "/opt/photonvision/photonvision.jar"
output_path = "${workspace.out_dir}/artifacts/photonvision-linuxarm64.jar"

[artifacts.execution]
backend = "docker"

# The jar build also builds the offline docs (Sphinx in a venv), which needs
# python3-venv; Gaia builds this image from the Dockerfile when it changes, so
# the rest of the build keeps using the plain photonvision-gaia-build image.
[artifacts.execution.docker]
image = "${input.raze_jar_build_image}"
dockerfile = "${input.raze_jar_build_dockerfile}"
