description = "HeliOS Raze target layer: board boot files and OV9782 camera module policy."
target = "helios-raze"

[[sources]]
id = "photonvision-source"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/photonvision.git"
branch = "${input.raze_photonvision_ref}"
refresh = "auto"
pin = "locked"

[[sources]]
id = "photon-libcamera-gl-driver"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/photon-libcamera-gl-driver.git"
branch = "${input.raze_libcamera_driver_ref}"
refresh = "auto"
pin = "locked"

[[artifacts]]
id = "photon-libcamera-gl-driver-local"
kind = "java"
build_target = "build/libs/work-linuxarm64.jar"
build_command = [
  "bash",
  "-lc",
  "trap 'docker run --rm -v \"$PWD:/work\" debian:bookworm chown -R \"$(id -u):$(id -g)\" /work/cmake_build /work/build /work/.gradle /work/.m2-arm64 2>/dev/null || true' EXIT; patch_file='${project.root_dir}/helios/raze/assets/patches/photon-libcamera-gl-driver/0001-raze-build-against-buildroot-sysroot.patch'; if git apply --reverse --check \"$patch_file\" >/dev/null 2>&1; then :; elif git apply --check \"$patch_file\" >/dev/null 2>&1; then git apply \"$patch_file\"; fi; ./tools/build_arm64_jni.sh",
]
build_env = [
  ["SYSROOT_DIR", "${project.root_dir}/${workspace.build_dir}/image/buildroot-output/host/aarch64-buildroot-linux-gnu/sysroot"],
  ["MAVEN_LOCAL_REPO", "${project.root_dir}/${workspace.build_dir}/m2"],
  ["GRADLE_EXTRA_ARGS", "-PversionString=${input.raze_libcamera_driver_version}"],
  ["CLEAN_BUILD", "0"],
]
after_image_prepare = true
source = "photon-libcamera-gl-driver"
install_name = "photon-libcamera-gl-driver.jar"
install_class = "archive"
output_path = "output/gaia/photonvision-${input.profile}-${input.target}/artifacts/photon-libcamera-gl-driver.jar"

[artifacts.execution]
backend = "host"

[[artifacts]]
id = "photonvision-jar"
kind = "java"
build_target = "photon-server/build/libs/photonvision-${input.raze_photonvision_version}-linuxarm64.jar"
build_command = [
  "bash",
  "-lc",
  "patch_file='${project.root_dir}/helios/raze/assets/patches/photonvision/0001-raze-avoid-duplicate-targeting-native-extraction.patch'; if git apply --reverse --check \"$patch_file\" >/dev/null 2>&1; then :; elif git apply --check \"$patch_file\" >/dev/null 2>&1; then git apply \"$patch_file\"; fi; ./gradlew :photon-targeting:_GROUP_org_photonvision_photontargeting_ID_photontargeting-cpp_CLS-linuxarm64 -q -Dmaven.repo.local='${project.root_dir}/${workspace.build_dir}/m2' -PArchOverride=linuxarm64 -PversionString='${input.raze_photonvision_version}' -PlibcameraDriverVersion='${input.raze_libcamera_driver_version}' && ./gradlew :photon-server:shadowJar -q -Dmaven.repo.local='${project.root_dir}/${workspace.build_dir}/m2' -PArchOverride=linuxarm64 -PversionString='${input.raze_photonvision_version}' -PlibcameraDriverVersion='${input.raze_libcamera_driver_version}'",
]
source = "photonvision-source"
dependencies = ["photon-libcamera-gl-driver-local"]
install_name = "photonvision.jar"
install_class = "archive"
install_dest_hint = "/opt/photonvision/photonvision.jar"
output_path = "output/gaia/photonvision-${input.profile}-${input.target}/artifacts/photonvision-linuxarm64.jar"

[artifacts.execution]
backend = "host"

[[stage.files]]
id = "helios-raze-config"
src = "helios/raze/assets/config.txt"
dest = "/boot/firmware/config.txt"
origin = "static-asset"

[[stage.files]]
id = "helios-raze-cmdline"
src = "helios/raze/assets/cmdline.txt"
dest = "/boot/firmware/cmdline.txt"
origin = "static-asset"

[[stage.files]]
id = "helios-raze-ov9782-modprobe"
src = "helios/raze/assets/ov9782.conf"
dest = "/etc/modprobe.d/ov9782.conf"
origin = "static-asset"

[[stage.files]]
id = "helios-raze-libcamera-pisp-ov9782"
src = "helios/raze/assets/libcamera/ipa/rpi/pisp/ov9782.json"
dest = "/usr/share/libcamera/ipa/rpi/pisp/ov9782.json"
origin = "static-asset"

[[stage.files]]
id = "helios-raze-libcamera-vc4-ov9782"
src = "helios/raze/assets/libcamera/ipa/rpi/vc4/ov9782.json"
dest = "/usr/share/libcamera/ipa/rpi/vc4/ov9782.json"
origin = "static-asset"

[[stage.files]]
id = "helios-raze-libcamera-tuning-ov9782"
src = "helios/raze/assets/libcamera/tuning/ov9782.overrides.json"
dest = "/usr/share/libcamera/tuning/ov9782.overrides.json"
origin = "static-asset"

[image]
kind = "buildroot"
defconfig = "raspberrypicm5io_defconfig"
external_tree = "helios/raze/assets/buildroot"
external_tree_mode = "required"
config_overrides = [
  ["BR2_LINUX_KERNEL_CUSTOM_TARBALL", "y"],
  ["BR2_LINUX_KERNEL_CUSTOM_TARBALL_LOCATION", "\"https://github.com/raspberrypi/linux/archive/refs/tags/stable_20250916.tar.gz\""],
  ["BR2_GLOBAL_PATCH_DIR", "\"board/raspberrypi/patches ${project.root_dir}/helios/raze/assets/buildroot/patches\""],
  ["BR2_LEGACY", "n"],
  ["BR2_LINUX_KERNEL_EXT_OV9782", "y"],
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "\"\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_CONFIG_FILE", "\"${project.root_dir}/helios/raze/assets/config.txt\""],
  ["BR2_PACKAGE_RPI_FIRMWARE_CMDLINE_FILE", "\"${project.root_dir}/helios/raze/assets/cmdline.txt\""],
  ["BR2_TARGET_ROOTFS_EXT2", "y"],
  ["BR2_TARGET_ROOTFS_EXT2_4", "y"],
  ["BR2_TARGET_ROOTFS_EXT2_SIZE", "\"512M\""],
  ["BR2_PACKAGE_LIBCAMERA", "y"],
  ["BR2_PACKAGE_LIBCAMERA_V4L2", "y"],
  ["BR2_PACKAGE_LIBCAMERA_PIPELINE_RPI_PISP", "y"],
  ["BR2_PACKAGE_LIBCAMERA_PIPELINE_RPI_VC4", "y"],
]

[[image.expected_images]]
name = "sdcard.img"
format = "raw"
required = true

[image.feed]
stage_files = [
  "helios-raze-config",
  "helios-raze-cmdline",
  "helios-raze-ov9782-modprobe",
  "helios-raze-libcamera-pisp-ov9782",
  "helios-raze-libcamera-vc4-ov9782",
  "helios-raze-libcamera-tuning-ov9782",
]

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "$provider.images"

[[image.assembly.trees]]
id = "boot"
path = "$assembly.work/boot"

[[image.assembly.files]]
tree = "boot"
src = "helios/raze/assets/config.txt"
dest = "config.txt"

[[image.assembly.files]]
tree = "boot"
src = "helios/raze/assets/cmdline.txt"
dest = "cmdline.txt"

[[image.assembly.files]]
tree = "boot"
src = "platform/raspberry-pi/assets/userconf.txt"
dest = "userconf.txt"

[[image.assembly.files]]
tree = "boot"
src_glob = "$provider.buildroot_output/build/rpi-firmware-*/boot/start4.elf"
dest = "."

[[image.assembly.files]]
tree = "boot"
src_glob = "$provider.buildroot_output/build/rpi-firmware-*/boot/fixup4.dat"
dest = "."

[[image.assembly.files]]
tree = "boot"
src_glob = "$provider.buildroot_output/images/bcm*.dtb"
dest = "."

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/bcm2712d0.dtbo"
dest = "overlays/bcm2712d0.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/disable-wifi.dtbo"
dest = "overlays/disable-wifi.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/disable-wifi-pi5.dtbo"
dest = "overlays/disable-wifi-pi5.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/disable-bt.dtbo"
dest = "overlays/disable-bt.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/disable-bt-pi5.dtbo"
dest = "overlays/disable-bt-pi5.dtbo"
optional = true

[[image.assembly.files]]
tree = "boot"
src = "$provider.buildroot_output/images/rpi-firmware/overlays/vc4-kms-v3d-pi5.dtbo"
dest = "overlays/vc4-kms-v3d-pi5.dtbo"
optional = true

[[image.assembly.transforms]]
kind = "gzip"
src = "$provider.buildroot_output/images/Image"
dest = "$assembly.tree.boot/kernel8.img"
deterministic = true

[[image.assembly.transforms]]
kind = "compile-dts"
src = "helios/raze/assets/buildroot/dt-overlays/ov9782-overlay.dts"
dest = "$assembly.tree.boot/overlays/ov9782.dtbo"

[[image.assembly.filesystems]]
id = "boot"
kind = "vfat"
source_tree = "boot"
output = "$provider.images/boot.vfat"
size = "64M"

[[image.assembly.disks]]
id = "sdcard"
output = "$provider.images/sdcard.img"
partition_table = "mbr"
signature = "0x5056525a"
first_lba = 2048
alignment_lba = 2048

[[image.assembly.disks.partitions]]
name = "boot"
type_alias = "fat32-lba"
bootable = true
image = "$provider.images/boot.vfat"

[[image.assembly.disks.partitions]]
name = "rootfs"
type_alias = "linux"
image = "$provider.images/rootfs.ext4"
